plugins {
    id 'com.android.application'
}

android {
    namespace 'com.godnit.systemoverlay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.godnit.systemoverlay'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/**']
        }
    }
}
