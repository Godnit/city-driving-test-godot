name: Build Circle Football APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'circle_football/**'
      - '.github/workflows/build-offline-football.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3
    env:
      GODOT_VERSION: 4.6.3
      ANDROID_SDK_ROOT: /tmp/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ANDROID_SDK_ROOT" /tmp/android-tools /tmp/android-tools.zip
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest" /tmp/android-tools
          wget -q -O /tmp/android-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          cp -a /tmp/android-tools/cmdline-tools/. "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Configure Godot Android export
        shell: bash
        run: |
          set -euo pipefail
          template_source=$(find /root/.local/share/godot -type f -name android_debug.apk -printf '%h\n' | head -n 1)
          template_target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_target"
          cp -a "$template_source"/. "$template_target"/
          java_home=${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")}
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$HOME/.config/godot/editor_settings-4.6.tres"
          {
            printf '\nexport/android/java_sdk_path = "%s"\n' "$java_home"
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT"
            printf 'export/android/debug_keystore = "/root/debug.keystore"\n'
            printf 'export/android/debug_keystore_user = "androiddebugkey"\n'
            printf 'export/android/debug_keystore_pass = "android"\n'
          } >> "$HOME/.config/godot/editor_settings-4.6.tres"
          test -f "$template_target/android_debug.apk"

      - name: Import and parse check
        shell: bash
        run: |
          set -euo pipefail
          cd circle_football
          godot --headless --editor --quit --path . 2>&1 | tee import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Invalid call|ERROR: Failed' import.log

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd circle_football
          timeout 25s godot --headless --path . -- --smoke-test 2>&1 | tee smoke.log
          grep -q 'CIRCLE_FOOTBALL_READY' smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Invalid call' smoke.log

      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          cd circle_football
          mkdir -p build
          apk=build/CircleFootball-Offline-v1.0.apk
          godot --headless --verbose --path . --export-debug Android "$apk" 2>&1 | tee build/export.log
          test -s "$apk"
          ! grep -E 'SCRIPT ERROR|Parse Error|Invalid call' build/export.log

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=circle_football/build/CircleFootball-Offline-v1.0.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/apksigner" verify --verbose "$apk"
          unzip -tq "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/aapt" dump badging "$apk" | tee circle_football/build/badging.txt
          grep -q "package: name='com.godnit.circlefootballoffline'" circle_football/build/badging.txt
          grep -q "native-code: 'armeabi-v7a'" circle_football/build/badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CircleFootball-Offline-v1.0-APK
          path: circle_football/build/CircleFootball-Offline-v1.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CircleFootball-build-diagnostics
          path: |
            circle_football/import.log
            circle_football/smoke.log
            circle_football/build/export.log
            circle_football/build/badging.txt
          if-no-files-found: ignore
          retention-days: 3
