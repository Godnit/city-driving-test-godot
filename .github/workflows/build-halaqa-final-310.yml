name: Build Halaqa 3.1.0 APK

on:
  push:
    branches: [halaqa-final-v310-build-20260802]
    paths:
      - 'halaqa-final-310/**'
      - '.github/workflows/build-halaqa-final-310.yml'
  pull_request:
    branches: [main]
    paths:
      - 'halaqa-final-310/**'
      - '.github/workflows/build-halaqa-final-310.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore version 3.0.2 source
        run: |
          cat halaqa-final-301/source.part.* | base64 --decode > source.zip
          echo 'bfe9ac39aaf9b9ff977a991832031fa9df3231823e16b6c2969b627c4948867e  source.zip' | sha256sum -c -
          unzip -q source.zip
          python3 halaqa-final-302/patch_v302.py
          grep -q "FINAL_VERSION='3.0.2'" halaqa_apk_project/app/src/main/assets/index.html

      - name: Delete and rebuild export system
        run: |
          cat halaqa-final-310/patch.part.* > /tmp/patch_v310.py
          python3 /tmp/patch_v310.py
          grep -q "FINAL_VERSION='3.1.0'" halaqa_apk_project/app/src/main/assets/index.html
          grep -q 'const FX_VERSION=' halaqa_apk_project/app/src/main/assets/index.html
          grep -q 'saveHtmlAsPdf' halaqa_apk_project/app/src/main/assets/index.html
          grep -q 'createPdfAtUri' halaqa_apk_project/app/src/main/java/com/halaqa/followup/MainActivity.java
          grep -q 'versionCode 13' halaqa_apk_project/app/build.gradle
          test "$(grep -o 'id="pdfExportModal"' halaqa_apk_project/app/src/main/assets/index.html | wc -l)" -eq 0
          test "$(grep -o 'id="freshExportModal"' halaqa_apk_project/app/src/main/assets/index.html | wc -l)" -eq 1
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('halaqa_apk_project/app/src/main/assets/index.html').read_text(encoding='utf-8')
          pathlib.Path('/tmp/app.js').write_text('\n;\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)),encoding='utf-8')
          required=['data-content="grades"','data-content="comprehensive"','data-period="weekly"','data-period="monthly"','fxSnapshot=Object.freeze','AndroidApp.saveHtmlAsPdf']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing export markers: '+repr(missing))
          PY
          node --check /tmp/app.js

      - name: Use PdfDocument renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('halaqa_apk_project/app/src/main/java/com/halaqa/followup/MainActivity.java')
          j=p.read_text(encoding='utf-8')
          j=j.replace('import android.graphics.Color;', 'import android.graphics.Color;\nimport android.graphics.pdf.PdfDocument;')
          j=j.replace('import java.io.InputStream;', 'import java.io.InputStream;\nimport java.io.FileOutputStream;')
          start=j.index('    private void writeAttachedWebViewPdf(WebView source) {')
          end=j.index('    private void finishDirectPdf(', start)
          method=r'''    private void writeAttachedWebViewPdf(WebView source) {
              PdfDocument document = null;
              FileOutputStream output = null;
              try {
                  final int webWidth = pendingPdfLandscape ? 1123 : 794;
                  final int pageWidth = pendingPdfLandscape ? 842 : 595;
                  final int pageHeight = pendingPdfLandscape ? 595 : 842;

                  int widthSpec = View.MeasureSpec.makeMeasureSpec(webWidth, View.MeasureSpec.EXACTLY);
                  int heightSpec = View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED);
                  source.measure(widthSpec, heightSpec);
                  int measured = Math.max(source.getMeasuredHeight(),
                          (int) Math.ceil(source.getContentHeight() * Math.max(1f, source.getScale())));
                  int contentHeight = Math.max(measured, pendingPdfLandscape ? 794 : 1123);
                  source.layout(0, 0, webWidth, contentHeight);

                  float scale = pageWidth / (float) webWidth;
                  float sliceHeight = pageHeight / scale;
                  int pageCount = Math.max(1, (int) Math.ceil(contentHeight / sliceHeight));

                  document = new PdfDocument();
                  for (int i = 0; i < pageCount; i++) {
                      PdfDocument.PageInfo info = new PdfDocument.PageInfo.Builder(
                              pageWidth, pageHeight, i + 1).create();
                      PdfDocument.Page page = document.startPage(info);
                      page.getCanvas().drawColor(Color.WHITE);
                      page.getCanvas().save();
                      page.getCanvas().scale(scale, scale);
                      page.getCanvas().translate(0f, -i * sliceHeight);
                      source.draw(page.getCanvas());
                      page.getCanvas().restore();
                      document.finishPage(page);
                  }

                  output = new FileOutputStream(pendingPdfDescriptor.getFileDescriptor());
                  document.writeTo(output);
                  output.flush();
                  finishDirectPdf(true, "تم حفظ تقرير PDF");
              } catch (Exception ex) {
                  finishDirectPdf(false, "تعذر إنشاء ملف PDF");
              } finally {
                  try { if (output != null) output.close(); } catch (Exception ignored) {}
                  try { if (document != null) document.close(); } catch (Exception ignored) {}
              }
          }

          '''
          j=j[:start]+method+j[end:]
          if 'new PdfDocument()' not in j or 'LayoutResultCallback' in j[j.index('private void writeAttachedWebViewPdf'):j.index('private void finishDirectPdf')]:
              raise SystemExit('PdfDocument renderer replacement failed')
          p.write_text(j,encoding='utf-8')
          PY

      - name: Restore signing key
        run: |
          mkdir -p "$HOME/.android"
          cat halaqa-final-301/key.part.* | base64 --decode > "$HOME/.android/debug.keystore"
          echo "f13409cbe227b94e6a24ebaa1aee1748dab8f61ffd0439c7f0b02474cc1b47ca  $HOME/.android/debug.keystore" | sha256sum -c -

      - name: Configure exact update signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('halaqa_apk_project/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          block='''android {
              signingConfigs {
                  updateRelease {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          '''
          s=s.replace('android {\n',block,1)
          s=s.replace('signingConfig signingConfigs.debug','signingConfig signingConfigs.updateRelease')
          if 'signingConfig signingConfigs.updateRelease' not in s:
              raise SystemExit('Signing configuration replacement failed')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build signed APK
        run: gradle -p halaqa_apk_project --no-daemon --stacktrace assembleRelease

      - name: Verify update certificate
        run: |
          keytool -printcert -jarfile halaqa_apk_project/app/build/outputs/apk/release/app-release.apk | tee /tmp/apk-cert.txt
          grep -q 'SHA256: 36:22:06:C5:34:F7:63:0C:9C:4A:8E:46:7E:5A:61:F2:2F:94:81:15:CC:47:EF:5F:F5:38:FA:58:D2:6D:EC:70' /tmp/apk-cert.txt

      - name: Prepare output
        run: |
          mkdir -p output
          cp halaqa_apk_project/app/build/outputs/apk/release/app-release.apk output/halaqa-followup-3.1.0.apk
          cp halaqa_apk_project/app/src/main/assets/index.html output/halaqa-followup-3.1.0.html
          cd halaqa_apk_project && zip -qr ../output/halaqa-followup-3.1.0-source.zip . && cd ..
          sha256sum output/halaqa-followup-3.1.0.apk > output/SHA256.txt
          cp /tmp/apk-cert.txt output/SIGNING_CERT.txt
          cat > output/UPDATE_INFO.txt <<'INFO'
          Package: com.halaqa.followup
          Version: 3.1.0
          Version code: 13
          The old export system was removed and rebuilt from scratch.
          Android saves the exact immutable preview document directly to PDF.
          Grades-only and comprehensive reports use separate renderers.
          Signed with the same update certificate as previous final versions.
          INFO

      - uses: actions/upload-artifact@v4
        with:
          name: halaqa-final-3-1-0-apk
          path: output/
          if-no-files-found: error
          retention-days: 30
