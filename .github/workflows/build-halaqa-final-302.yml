name: Build Halaqa 3.0.2 APK

on:
  push:
    branches: [halaqa-final-v302-build-20260801]
    paths:
      - 'halaqa-final-302/**'
      - '.github/workflows/build-halaqa-final-302.yml'
  pull_request:
    branches: [main]
    paths:
      - 'halaqa-final-302/**'
      - '.github/workflows/build-halaqa-final-302.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore and patch source
        run: |
          cat halaqa-final-301/source.part.* | base64 --decode > source.zip
          echo 'bfe9ac39aaf9b9ff977a991832031fa9df3231823e16b6c2969b627c4948867e  source.zip' | sha256sum -c -
          unzip -q source.zip
          python3 halaqa-final-302/patch_v302.py
          grep -q "FINAL_VERSION='3.0.2'" halaqa_apk_project/app/src/main/assets/index.html
          grep -q 'freshHtml=buildReport(fixedState)' halaqa_apk_project/app/src/main/assets/index.html
          grep -q 'weekly-print-v302' halaqa_apk_project/app/src/main/java/com/halaqa/followup/MainActivity.java
          grep -q 'versionCode 12' halaqa_apk_project/app/build.gradle
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('halaqa_apk_project/app/src/main/assets/index.html').read_text(encoding='utf-8')
          pathlib.Path('/tmp/app.js').write_text('\n;\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)),encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Restore signing key
        run: |
          mkdir -p "$HOME/.android"
          cat halaqa-final-301/key.part.* | base64 --decode > "$HOME/.android/debug.keystore"
          echo "f13409cbe227b94e6a24ebaa1aee1748dab8f61ffd0439c7f0b02474cc1b47ca  $HOME/.android/debug.keystore" | sha256sum -c -
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build signed APK
        run: gradle -p halaqa_apk_project --no-daemon --stacktrace assembleRelease

      - name: Prepare output
        run: |
          mkdir -p output
          cp halaqa_apk_project/app/build/outputs/apk/release/app-release.apk output/halaqa-followup-3.0.2.apk
          cp halaqa_apk_project/app/src/main/assets/index.html output/halaqa-followup-3.0.2.html
          sha256sum output/halaqa-followup-3.0.2.apk > output/SHA256.txt
          keytool -printcert -jarfile output/halaqa-followup-3.0.2.apk > output/SIGNING_CERT.txt
          cat > output/UPDATE_INFO.txt <<'INFO'
          Package: com.halaqa.followup
          Version: 3.0.2
          Version code: 12
          Weekly PDF export now reloads the exact selected report into the attached main WebView before Android opens Save as PDF.
          INFO

      - uses: actions/upload-artifact@v4
        with:
          name: halaqa-final-3-0-2-apk
          path: output/
          if-no-files-found: error
          retention-days: 30
