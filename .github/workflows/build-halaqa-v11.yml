name: Build Halaqa Follow-up APK v1.1

on:
  push:
    branches: [halaqa-apk-build-20260731]
    paths: ['.github/workflows/build-halaqa-v11.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/build-halaqa-v11.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$SDK_ROOT/platforms/android-35" ] || [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Restore Android project
        run: |
          cat halaqa-build-v12/source.part.* | base64 --decode > halaqa-source-v11.zip
          echo 'ef28da1668359af234657df0a462a1395403c119b2c6f78f0bfc6a8b2ebf81f0  halaqa-source-v11.zip' | sha256sum -c -
          unzip -q halaqa-source-v11.zip
          test -f halaqa_apk_project/app/src/main/assets/index.html

      - name: Reuse previous signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8797282011/zip" \
            -o previous-artifact.zip
          mkdir previous-artifact
          unzip -q previous-artifact.zip -d previous-artifact
          mkdir -p "$HOME/.android"
          cp previous-artifact/halaqa-followup-signing-key.keystore "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build APK update
        run: gradle -p halaqa_apk_project --no-daemon --stacktrace assembleDebug

      - name: Prepare output
        run: |
          mkdir -p output
          cp halaqa_apk_project/app/build/outputs/apk/debug/app-debug.apk output/halaqa-followup-v1.1.apk
          sha256sum output/halaqa-followup-v1.1.apk > output/SHA256.txt
          keytool -printcert -jarfile output/halaqa-followup-v1.1.apk > output/SIGNING_CERT.txt
          cat > output/UPDATE_INFO.txt <<'INFO'
          Package: com.halaqa.followup
          Version: 1.1.0
          Version code: 2
          Signed with the same key as version 1.0.0.
          INFO

      - uses: actions/upload-artifact@v4
        with:
          name: halaqa-followup-apk-v1-1
          path: output/
          if-no-files-found: error
          retention-days: 30
