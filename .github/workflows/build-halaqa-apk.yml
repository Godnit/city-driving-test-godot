name: Build Halaqa Follow-up APK

on:
  push:
    branches: [halaqa-apk-build-20260731]
    paths: ['.github/workflows/build-halaqa-apk.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "Android SDK: $SDK_ROOT"
          if [ ! -d "$SDK_ROOT/platforms/android-35" ] || [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Restore Android project
        run: |
          sha256sum halaqa-build/source.part.0[0-7]
          cat halaqa-build/source.part.0[0-7] | base64 --decode > halaqa-source.zip
          echo "Expected ZIP SHA256: 08aed8a474cf5f8a88ec3b1e27e22431afd606152ecc8d7c69a4b42ca8f51d80"
          sha256sum halaqa-source.zip
          echo '08aed8a474cf5f8a88ec3b1e27e22431afd606152ecc8d7c69a4b42ca8f51d80  halaqa-source.zip' | sha256sum -c -
          unzip -q halaqa-source.zip
          test -f halaqa_apk_project/app/src/main/assets/index.html

      - name: Create signing key
        run: |
          mkdir -p $HOME/.android
          rm -f $HOME/.android/debug.keystore
          keytool -genkeypair -v \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Halaqa Followup, OU=Education, O=Halaqa, L=Sanaa, ST=Sanaa, C=YE'

      - name: Build APK
        run: gradle -p halaqa_apk_project --no-daemon --stacktrace assembleDebug

      - name: Prepare output
        run: |
          mkdir -p output
          cp halaqa_apk_project/app/build/outputs/apk/debug/app-debug.apk output/halaqa-followup.apk
          cp $HOME/.android/debug.keystore output/halaqa-followup-signing-key.keystore
          cat > output/SIGNING_INFO.txt <<'INFO'
          App package: com.halaqa.followup
          Keystore: halaqa-followup-signing-key.keystore
          Alias: androiddebugkey
          Keystore password: android
          Key password: android
          Keep this file private. Future updates need the same key and a higher versionCode.
          INFO
          sha256sum output/halaqa-followup.apk > output/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: halaqa-followup-apk
          path: output/
          if-no-files-found: error
          retention-days: 30
