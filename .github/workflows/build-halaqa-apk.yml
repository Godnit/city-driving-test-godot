name: Build Halaqa Follow-up APK

on:
  push:
    branches: [halaqa-apk-build-20260731]
    paths: ['.github/workflows/build-halaqa-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore Android project
        run: |
          cat halaqa-build/source.part.* | base64 --decode > halaqa-source.zip
          unzip -q halaqa-source.zip
          test -f halaqa_apk_project/app/src/main/assets/index.html

      - name: Create signing key
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Halaqa Followup, OU=Education, O=Halaqa, L=Sanaa, ST=Sanaa, C=YE'

      - name: Build APK
        run: gradle -p halaqa_apk_project --no-daemon --stacktrace assembleDebug

      - name: Prepare output
        run: |
          mkdir -p output
          cp halaqa_apk_project/app/build/outputs/apk/debug/app-debug.apk output/halaqa-followup.apk
          cp $HOME/.android/debug.keystore output/halaqa-followup-signing-key.keystore
          cat > output/SIGNING_INFO.txt <<'INFO'
          App package: com.halaqa.followup
          Keystore: halaqa-followup-signing-key.keystore
          Alias: androiddebugkey
          Keystore password: android
          Key password: android
          Keep this file private. Future updates need the same key and a higher versionCode.
          INFO
          sha256sum output/halaqa-followup.apk > output/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: halaqa-followup-apk
          path: output/
          if-no-files-found: error
          retention-days: 30
