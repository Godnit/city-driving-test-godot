name: Build Halaqa Phase 1 APK

on:
  push:
    branches: [halaqa-phase1-build-final]
    paths:
      - '.github/workflows/build-halaqa-apk.yml'
      - 'halaqa-phase1/**'
  workflow_dispatch:

concurrency:
  group: halaqa-phase1-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: halaqa-phase1-build-final

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$SDK_ROOT/platforms/android-35" ] || [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Restore and patch Android project
        run: |
          cat halaqa-build/source.part.0[0-7] | base64 --decode > halaqa-source.zip
          echo '08aed8a474cf5f8a88ec3b1e27e22431afd606152ecc8d7c69a4b42ca8f51d80  halaqa-source.zip' | sha256sum -c -
          unzip -q halaqa-source.zip
          APP=halaqa_apk_project/app
          cp halaqa-phase1/phase1.css "$APP/src/main/assets/phase1.css"
          cp halaqa-phase1/phase1.js "$APP/src/main/assets/phase1.js"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('halaqa_apk_project/app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          if 'phase1.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="phase1.css">\n</head>')
          if 'phase1.js' not in s:
              s = s.replace('</body>', '<script src="phase1.js"></script>\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
          sed -i 's/import android\.app\.PrintManager;/import android.print.PrintManager;/' "$APP/src/main/java/com/halaqa/followup/MainActivity.java"
          sed -i 's/return "1\.0\.0";/return "1.1.0";/' "$APP/src/main/java/com/halaqa/followup/MainActivity.java"
          sed -i -E 's/versionCode [0-9]+/versionCode 2/' "$APP/build.gradle"
          sed -i -E "s/versionName '[^']+'/versionName '1.1.0'/" "$APP/build.gradle"
          grep -q 'phase1.js' "$APP/src/main/assets/index.html"
          grep -q 'versionCode 2' "$APP/build.gradle"

      - name: Reuse existing application signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8797282011/zip" \
            -o previous-artifact.zip
          mkdir previous-artifact
          unzip -q previous-artifact.zip -d previous-artifact
          mkdir -p "$HOME/.android"
          cp previous-artifact/halaqa-followup-signing-key.keystore "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build signed update APK
        run: gradle -p halaqa_apk_project --no-daemon --stacktrace assembleDebug

      - name: Publish APK payload to temporary branch
        run: |
          mkdir -p halaqa-phase1-output
          APK=halaqa_apk_project/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" halaqa-phase1-output/halaqa-phase1.apk
          base64 -w0 "$APK" > halaqa-phase1-output/halaqa-phase1.apk.b64
          sha256sum "$APK" > halaqa-phase1-output/SHA256.txt
          keytool -printcert -jarfile "$APK" > halaqa-phase1-output/SIGNING_CERT.txt
          cat > halaqa-phase1-output/UPDATE_INFO.txt <<'INFO'
          Package: com.halaqa.followup
          Version: 1.1.0
          Version code: 2
          Phase: 1
          Signed with the same key as version 1.0.0.
          INFO
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add halaqa-phase1-output
          git commit -m 'Publish Halaqa phase 1 APK' || exit 0
          git push origin HEAD:halaqa-phase1-build-final
