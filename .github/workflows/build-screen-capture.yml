name: Build QuickScreenshot APK

on:
  push:
    branches:
      - screen-capture-app
    paths:
      - 'screen_capture_app/**'
      - '.github/workflows/build-screen-capture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle 8.7
        run: |
          curl -L --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo '/tmp/gradle-8.7/bin' >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle -p screen_capture_app :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          cp screen_capture_app/app/build/outputs/apk/debug/app-debug.apk release/QuickScreenshot.apk
          sha256sum release/QuickScreenshot.apk > release/QuickScreenshot.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickScreenshot-APK
          path: release/QuickScreenshot.apk

      - name: Commit APK to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/QuickScreenshot.apk release/QuickScreenshot.sha256
          if git diff --cached --quiet; then
            echo 'APK unchanged'
          else
            git commit -m 'Build QuickScreenshot APK [skip ci]'
            git push origin HEAD:screen-capture-app
          fi
