name: Diagnose Reality Builder Source Upload

on:
  pull_request:
    branches: [main]
    paths:
      - 'reality_builder_trigger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Print source part sizes and SHA256
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$GITHUB_HEAD_REF" https://github.com/Godnit/city-driving-test-godot.git repo
          cd repo
          for file in reality_builder_build/source.tar.xz.b64.part*; do
            wc -c "$file"
            sha256sum "$file"
          done
          cat reality_builder_build/source.tar.xz.b64.part* > /tmp/source.b64
          wc -c /tmp/source.b64
          sha256sum /tmp/source.b64
