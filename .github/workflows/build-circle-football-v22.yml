name: Build Circle Football v2.2

on:
  push:
    branches: [circle-football-v2.2-arcade-slow-equal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify APK
        shell: bash
        run: bash circle_football_native/build_v22.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CircleFootball-Android81-v2.2-APK
          path: circle_football_native/build/CircleFootball-Android81-v2.2.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: CircleFootball-Android81-v2.2-Report
          path: |
            circle_football_native/build/badging.txt
            circle_football_native/build/size.txt
            circle_football_native/build/apk-files.txt
          if-no-files-found: error
          retention-days: 7
