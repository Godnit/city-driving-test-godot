name: Build Reality Builder Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-reality-builder.yml'
      - 'reality_builder_build/**'
  pull_request:
    branches: [main]
    paths:
      - 'reality_builder_trigger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3
    env:
      GODOT_VERSION: 4.6.3
      ANDROID_SDK_ROOT: /tmp/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify Reality Builder source
        shell: bash
        run: |
          set -euo pipefail
          cat reality_builder_build/source.tar.xz.b64.part* > /tmp/source.b64
          echo 'c7ab30484a65f2728fba7906b1c690a5aedfb818a2b299fb50f58dac9a41e024  /tmp/source.b64' | sha256sum -c -
          base64 --decode /tmp/source.b64 > /tmp/RealityBuilder.tar.xz
          echo 'c11bd036e629990c006f3c22127349c2c6ae8d615fcf041c26fdc607251cf85d  /tmp/RealityBuilder.tar.xz' | sha256sum -c -
          mkdir -p /tmp/reality-builder-source
          tar -xJf /tmp/RealityBuilder.tar.xz -C /tmp/reality-builder-source
          rm -rf RealityBuilder
          cp -a /tmp/reality-builder-source/RealityBuilder ./RealityBuilder
          test -s RealityBuilder/project.godot
          test -s RealityBuilder/scenes/main.tscn
          test -s RealityBuilder/assets/icon.png
          echo "Source reconstructed successfully"
          du -sh RealityBuilder

      - name: Create Android export preset
        shell: bash
        run: |
          set -euo pipefail
          cat > RealityBuilder/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/android/RealityBuilder-v0.10.16-Android.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1016
          version/name="0.10.16"
          package/unique_name="com.godnit.realitybuilder"
          package/name="Reality Builder"
          package/signed=true
          package/app_category=1
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          permissions/internet=false
          permissions/access_network_state=false
          permissions/vibrate=false
          EOF
          test -s RealityBuilder/export_presets.cfg

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ANDROID_SDK_ROOT" /tmp/android-tools /tmp/android-tools.zip
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest" /tmp/android-tools
          wget -q -O /tmp/android-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          cp -a /tmp/android-tools/cmdline-tools/. "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'

      - name: Configure Godot Android export
        shell: bash
        run: |
          set -euo pipefail
          template_source=$(find /root/.local/share/godot -type f -name android_debug.apk -printf '%h\n' | head -n 1)
          test -n "$template_source"
          template_target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_target"
          cp -a "$template_source"/. "$template_target"/
          java_home=${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")}
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$HOME/.config/godot/editor_settings-4.6.tres"
          {
            printf '\nexport/android/java_sdk_path = "%s"\n' "$java_home"
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT"
            printf 'export/android/debug_keystore = "/root/debug.keystore"\n'
            printf 'export/android/debug_keystore_user = "androiddebugkey"\n'
            printf 'export/android/debug_keystore_pass = "android"\n'
          } >> "$HOME/.config/godot/editor_settings-4.6.tres"
          test -f "$template_target/android_debug.apk"
          godot --version

      - name: Import and validate Godot project
        shell: bash
        working-directory: RealityBuilder
        run: |
          set -o pipefail
          godot --headless --editor --quit --path . 2>&1 | tee import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Invalid call' import.log

      - name: Export Android APK
        shell: bash
        working-directory: RealityBuilder
        run: |
          set -euo pipefail
          mkdir -p build/android
          apk=build/android/RealityBuilder-v0.10.16-Android.apk
          godot --headless --verbose --path . --export-debug Android "$apk" 2>&1 | tee build/android/export.log
          test -s "$apk"
          ! grep -E 'SCRIPT ERROR|Parse Error|Invalid call' build/android/export.log

      - name: Verify APK and calculate size
        shell: bash
        working-directory: RealityBuilder
        run: |
          set -euo pipefail
          apk=build/android/RealityBuilder-v0.10.16-Android.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/apksigner" verify --verbose "$apk"
          unzip -tq "$apk"
          size=$(stat -c%s "$apk")
          size_mb=$(awk "BEGIN {printf \"%.2f\", $size/1048576}")
          echo "APK size: $size bytes ($size_mb MB)"
          test "$size" -le $((150 * 1024 * 1024))
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/aapt" dump badging "$apk" | tee build/android/badging.txt
          grep -q "package: name='com.godnit.realitybuilder'" build/android/badging.txt
          grep -q "armeabi-v7a" build/android/badging.txt
          grep -q "arm64-v8a" build/android/badging.txt
          sha256sum "$apk" | tee build/android/SHA256SUMS.txt
          {
            echo '## Reality Builder APK'
            echo "- File: RealityBuilder-v0.10.16-Android.apk"
            echo "- Size: $size_mb MB ($size bytes)"
            echo "- Package: com.godnit.realitybuilder"
            echo "- Architectures: armeabi-v7a, arm64-v8a"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: RealityBuilder-v0.10.16-Android-APK
          path: |
            RealityBuilder/build/android/RealityBuilder-v0.10.16-Android.apk
            RealityBuilder/build/android/SHA256SUMS.txt
            RealityBuilder/build/android/badging.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealityBuilder-v0.10.16-Diagnostics
          path: |
            RealityBuilder/import.log
            RealityBuilder/build/android/export.log
            RealityBuilder/build/android/badging.txt
          if-no-files-found: ignore
          retention-days: 3
