name: Build Circle Football v1.7

on:
  push:
    branches: [circle-football-v1.7-roles-audio]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest" "$RUNNER_TEMP/tools"
          wget -q -O "$RUNNER_TEMP/tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q "$RUNNER_TEMP/tools.zip" -d "$RUNNER_TEMP/tools"
          cp -a "$RUNNER_TEMP/tools/cmdline-tools/." "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "build-tools;35.0.1"
      - name: Patch and compile
        run: |
          cd circle_football_native
          python3 v17_run.py
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.1"
          JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          rm -rf build obj dex classes.dex
          mkdir -p build obj dex
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$JAR" -d obj $(find src -name '*.java')
          "$BT/d8" --min-api 21 --lib "$JAR" --output dex $(find obj -name '*.class')
          "$BT/aapt" package -f -M AndroidManifest.xml -S res -I "$JAR" -F build/base.apk
          cp dex/classes.dex classes.dex
          "$BT/aapt" add build/base.apk classes.dex >/dev/null
          "$BT/zipalign" -f 4 build/base.apk build/aligned.apk
      - name: Sign APK
        run: |
          cd circle_football_native
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.1"
          keytool -genkeypair -noprompt -keystore build/app.keystore -storepass android -alias app -keypass android -dname "CN=CircleFootball" -keyalg RSA -keysize 2048 -validity 10000
          "$BT/apksigner" sign --ks build/app.keystore --ks-pass pass:android --key-pass pass:android --out build/CircleFootball-Android81-v1.7.apk build/aligned.apk
          "$BT/apksigner" verify --verbose build/CircleFootball-Android81-v1.7.apk
          "$BT/aapt" dump badging build/CircleFootball-Android81-v1.7.apk | tee build/badging.txt
          grep -q "package: name='com.godnit.circlefootballlite.v17'" build/badging.txt
          grep -q "sdkVersion:'21'" build/badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CircleFootball-Android81-v1.7-APK
          path: circle_football_native/build/CircleFootball-Android81-v1.7.apk
          retention-days: 14
